name: freeze
description: "스마트 냉장고 식재료 관리 및 레시피 추천 시스템"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 카메라 & 이미지
  camera: ^0.11.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0

  # 네트워크
  http: ^1.2.2
  dio: ^5.7.0

  # 상태 관리
  provider: ^6.1.2

  # 로컬 DB
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0

  # 유틸
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
