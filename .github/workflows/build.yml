name: Build Mod

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: List available Forge versions for 1.26.2
        run: |
          echo "=== Forge versions ==="
          curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -oE '<version>1\.26\.2-[^<]+</version>' | tail -20 || echo "1.26.2용 Forge 없음"
          echo
          echo "=== 가장 최신 Forge 버전들 ==="
          curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -oE '<version>[^<]+</version>' | tail -10

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Freeze-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
