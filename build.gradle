// Forge 1.26.2 (26.2) mod - 공식 MDK 기반 (ForgeGradle 7)
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

version = '1.0.0'
group = 'com.freeze'
base {
    archivesName = 'freeze'
}

// Mojang은 26.1+ 부터 Java 25를 배포 -> 모드도 Java 25 타겟
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 생성 리소스 포함
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'freeze'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.0.0')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
