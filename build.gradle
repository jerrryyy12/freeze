// Minecraft 1.21.1 Forge 모드 (MECCHA CHAMELEON / ForgeGradle 6)
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// 빌드(CI 실행)마다 버전 자동 증가 → jar 이름이 매번 달라짐
version = "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: 'dev'}"
group = 'com.chameleon'

base {
    archivesName = 'chameleon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'chameleon',
            'Specification-Vendor'    : 'chameleon',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'freeze'
        ])
    }
}
